name: Remove project deployments and artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-project.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pages: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove GitHub Pages and saved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GH_REPO']
          def api(method,path):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw=r.read()
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:return e.code,{}
          code,_=api('DELETE','/pages')
          print('Pages removal HTTP',code)
          for collection,item in [('/actions/artifacts?per_page=100','artifacts'),('/actions/runs?per_page=100','workflow_runs')]:
              code,data=api('GET',collection)
              for entry in data.get(item,[]):
                  if str(entry['id'])==os.environ['CURRENT_RUN']:continue
                  path=('/actions/artifacts/' if item=='artifacts' else '/actions/runs/')+str(entry['id'])
                  code,_=api('DELETE',path)
                  print('Removed',item,entry['id'],'HTTP',code)
          if code>=400:raise SystemExit('Some cleanup operations need repository-owner access.')
          PY
