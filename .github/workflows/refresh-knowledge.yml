name: Refresh Freshchat knowledge
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-knowledge.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub secrets
        env:
          FRESHCHAT_API_TOKEN: ${{ secrets.FRESHCHAT_API_TOKEN }}
          KNOWLEDGE_PASSWORD: ${{ secrets.KNOWLEDGE_PASSWORD }}
        run: |
          test -n "$FRESHCHAT_API_TOKEN" || { echo 'Add the FRESHCHAT_API_TOKEN repository secret.'; exit 1; }
          test -n "$KNOWLEDGE_PASSWORD" || { echo 'Add the KNOWLEDGE_PASSWORD repository secret.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent daily chat transcripts
        env:
          FRESHCHAT_API_TOKEN: ${{ secrets.FRESHCHAT_API_TOKEN }}
          FRESHCHAT_BASE_URL: ${{ vars.FRESHCHAT_BASE_URL || 'https://api.in.freshchat.com' }}
        run: python scripts/github/fetch-daily.py
      - name: Refresh encrypted knowledge
        env:
          KNOWLEDGE_PASSWORD: ${{ secrets.KNOWLEDGE_PASSWORD }}
        run: node scripts/github/update.mjs
      - name: Save encrypted update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/knowledge
          if ! git diff --cached --quiet; then
            git commit -m "Refresh encrypted Freshchat support knowledge"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish refreshed support bot
        id: deployment
        uses: actions/deploy-pages@v4
